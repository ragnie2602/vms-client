/*------------NHOM CHUC NANG QUAN LY CAMERA--------------*/
message ListCamera // done
{
  message Request
  {
    uint64 last_time = 1;
  }
  message Reply
  {
    repeated Camera cameras = 1;
    repeated DeviceGroup groups = 2;
  }
  uint32 ID = 140;
}

message AddCamera // need update
{
  enum Status {OFF = 0; ON = 1;}
  message Request
  {
    string name = 1;
    string serial_number = 2;
    string username = 3;
    string password = 4;
  }
  message Reply
  {
    Camera camera = 1;
    Status status = 2;
  }
  enum Error
  {
    ERROR_DEFAULT = 0;
    CAMERA_NOT_EXIST = 1;
    CAMERA_NOT_CONNECTION = 2;
    USERNAME_INVALID = 3;
    PASSWORD_INVALID = 4;
    SERIAL_NOT_EXIST = 5;
    ACTIVE_CAMERA_ERROR = 6;
    ALREADY_ADDED = 7;
    ALREADY_ADDED_BY_OTHER_ACCOUNT = 8;
  }
  uint32 ID = 141;
}

/*------------NHOM CHUC NANG CAI DAT CAMERA-------------*/
message UpdateCamera // done
{

  message Request
  {
    bytes camera_id = 1;
    string name = 2; /// gửi lên nếu muốn thay đổi
    string rtsp_url = 3; // gửi lên nếu muốn thay đổi rtsp
    string user_name = 4; // gửi lên nếu thay đổi
    string password = 5; // gửi lên nếu muốn thay đổi
    uint32 storage_day = 6; /// bỏ ko sử dụng trường này
    string xaddr = 7 ;
    MapLocation location = 8; /// location của camera => nếu ko cập nhật gửi location cũ , xoá location không gửi gì
    repeated string sub_stream_urls = 9; // Gửi danh sách luồng phụ của camera
  }
  message Reply
  {
    Camera camera = 1;
  }

  enum Error
  {
    ERROR_DEFAULT = 0;
    RTSP_URL_INVALID = 1;
    NAME_INVALID = 3;
    CAMERA_ID_INVALID = 4;
    IP_OR_DOMAIN_INVALID = 5; /// đường dẫn rtsp lỗi
    RTSP_PORT_ERROR = 6; /// port của rtsp lỗi
    USER_NAME_OR_PASSWORD_ERROR = 7;/// sai tài khoản hoặc mật khẩu
    CAMERA_EXIST = 8;
    CAMERA_UUID_INVALID = 9;
    XADDR_EMPTY = 10;
    XADDR_INVALID = 11;  /// lỗi onvif api
    LOCATION_INVALID = 12;
    CAMERA_NAME_EXIST = 13;
    GET_SERIAL_NUMBER_CAMERA_ERROR = 14; /// không lấy được thông tin serial number
    SERIAL_NUMBER_NOT_MATH = 15; /// SERIAL_NUMBER camera update không giống camera cũ được thêm vào
    BOX_ID_INVALID = 16;
    BOX_OFFLINE = 17;
    SUB_STREAM_INVALID = 18; //Lỗi luồng phụ (TH gửi nhiều substream url --> chỉ trả về lỗi nếu tất cả url đều lỗi, nếu tồn tại url đúng --> lưu url đúng)
  }


  uint32 ID = 142;
}

