syntax = "proto3";
import "comm.model.proto";
import "google/protobuf/any.proto";
package comm;
//option optimize_for = LITE_RUNTIME;
//ID: [140-169]
//receive: [20-40]
option java_package = "com.vivas.ipcamera.core.protobuf";
message ReceiveAddCamera
{
  enum Status {SUCCESS = 0; FAILED = 1;}
  Camera camera = 1;
  Status status = 2;
  uint32 RECEIVE_ADD_CAMERA = 23;
}

message ReceiveNotificationCamera
{
  enum Status {SUCCESS = 0; FAILED = 1;}
  enum Type {MOTION_DETECTION = 0; CAMERA_OFFLINE = 1; STATUS_STORAGE_SDCARD = 2; UPDATE_FIRMWARE = 3; SOUND_DETECTION = 4; LINE_CROSSING = 5; INTRUSION_DETECTION = 6;CAMERA_ONLINE = 7;}
  enum Form {SD_CARD = 0; CLOUD = 1;}
  bytes camera_id = 1;
  string camera_name = 2;
  Type type = 3;
  Alarm alarm = 4;
  Status status = 5;
  Form form = 6;
  uint32 RECEIVE_NOTIFICATION_CAMERA = 25;
}

message ReceiveScheduleCamera
{
  enum Status {SUCCESS = 0; FAILED = 1;}
  bytes camera_id = 1;
  Status status = 2;
  Recording recording = 3;
  uint32 RECEIVE_RESULT_SHEDULE_CAMERA = 39;
}

message ReceiveTimeShiftCamera
{
  enum Status {SUCCESS = 0; FAILED = 1; SD_CARD_NOT_FOUND = 2;}
  message Video
  {
    string name = 1;
    EventType event_type = 2;
    uint32 duration = 3;
    uint64 time = 4;
  }
  bytes camera_id = 1;
  repeated Video videos = 2;
  bool end = 3;
  bool has_Sdcard = 4;
  Status status = 5;
  uint32 RECEIVE_TIMESHIFT_CAMERA = 40;
}

message ReceiveShareCamera
{
  enum Role {VIEW = 0; FULL = 1;}
  bytes camera_id = 1 [deprecated = true];
  string account_a = 2 [deprecated = true];
  string account_b = 3 [deprecated = true];
  string camera_name = 4 [deprecated = true];
  Role role = 5 [deprecated = true];
  uint64 time = 6 [deprecated = true];
  bool isOwner = 7 [deprecated = true]; // == true , là người share , == false là người nhận share
  bytes invite_msg_id = 8 [deprecated = true]; // id của invite msg
  uint32 RECEIVE_SHARE_CAMERA = 45 [deprecated = true];
}

message ReceiveResponseShareCamera
{
  enum Action {ACCEPT = 0; DECLINE = 1;}
  bytes camera_id = 1;
  string account_a = 2;
  string account_b = 3;
  Action action = 4;
  uint32 RECEIVE_RESPONSE_SHARE_CAMERA = 46;
}

message ReceiveDeleteShareCamera
