    //		Level level = 4; /// mức level
    bool is_send_email = 5;
    bool is_record = 6;
    bool isPushNotification = 7;
    Roi roi_start = 8;
    Roi roi_end = 9;
    Roi direction_start = 10;
    Roi direction_end = 11;
  }
  message Reply
  {
    Camera camera = 1;
  }
  enum Error
  {
    ERROR_DEFAULT = 0;
    CAMERA_ID_EMPTY = 1;
    CAMERA_NOT_FOUND = 2;
    IVA_SV_ERROR = 3;
    IVA_NOT_REGISTER = 4; /// chưa kích hoạt gói cước
    IVA_TOO_MANY_REQUEST = 5; /// sv iva hết tài nguyên
    OVER_QUOTA = 6;//Vượt quá số camera được add (theo license)
    PERMISSION_DENIED = 7; //Trả về nếu người dùng không có quyền cấu hình iva
  }
  uint32 ID = 240;
}
