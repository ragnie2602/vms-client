message GetEventCloud
{
	enum ALPR_Vehicle_Type{
		ALL = 0;
		CAR = 1;
		TRUCK = 2;
		MOTORBIKE = 3;
	}
	message Request
	{
		repeated bytes camera_id = 1;
		repeated EventType types = 2;
		uint64 from_date = 3;
		uint64 to_date = 4;
		bytes last_id = 5;
		uint32 count = 6;
		ALPR_Vehicle_Type vehicle_Type = 7; /// sử dụng với Eventype = IVA_ALPR mặc định = 0 lấy ALL
		string vehicle_plate = 8; /// sử dụng với Eventype = IVA_ALPR mặc định không lọc
		bool isExportExcel = 9; /// chỉ hỗ trợ xuất xlsx cho loại sự kiện ALPR

	}
	message Reply
	{
		bool isEnd = 1;
		repeated Event events = 2;
		string xlsx_url = 3;
	}
	enum Error
	{
		ERROR_DEFAULT = 0;
		USER_NOT_FOUND = 1;
		FORM_DATE_TO_DATE_INVALID = 2;
	}
	uint32 ID = 194;
}

