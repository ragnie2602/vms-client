message Config_RTSP_ONVIF_Motion_Detect
{
	enum Level { LOW = 0; MEDIUM = 1; HIGH = 2; }

	message Request
	{
		bytes camera_id = 1;
		bool isEnable_md = 2;
		Level level = 3; /// mức level dùng chung cho cả MD và Region MD
		bool is_send_email = 4;
		bool is_record = 5;
		bool isPushNotification = 6;
		repeated Roi rois = 7; // danh sách toạ độ >= 3 toạ độ điểm ( mặc định md = 4 điểm 0,0 100,0 100,100 100,0 toàn khung hình)
		bool soundAlarm = 8; ///  HOME VISION ||  bật tắt cảnh báo âm thanh khi phát hiện chuyển động ( âm thanh này phát trên camera ) hỗ trợ camera HOME VISION
	}
	message Reply
	{
		bytes camera_id = 1;
		Camera camera = 2;
	}
	enum Error
	{
		ERROR_DEFAULT = 0;
		CAMERA_ID_EMPTY = 1;
		CAMERA_NOT_FOUND = 2;
		IVA_SV_ERROR = 3;
		IVA_NOT_REGISTER = 4; /// chưa kích hoạt gói cước
		IVA_TOO_MANY_REQUEST = 5; /// sv iva hết tài nguyên
		OVER_QUOTA = 6;//Vượt quá số camera được add (theo license)
		PERMISSION_DENIED = 7; //Trả về nếu người dùng không có quyền cấu hình iva


