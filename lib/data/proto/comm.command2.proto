syntax = "proto3";
import "comm.model.proto";
package comm;
//option optimize_for = LITE_RUNTIME;
//ID: [140-169]
//receive: [20-40]
option java_package = "com.vivas.ipcamera.core.protobuf";
/*-------------NHOM CHUC NANG QUAN LY SU KIEN---------------*/
message ListAlarm
{
	message Request
	{
		bytes camera_id = 1;
		bytes last_id = 2;
		uint32 count = 3;
	}
	message Reply
	{
		repeated Alarm alarms = 1;
		bool end = 2;
	}
	uint32 ID = 159;
}

message DeleteAlarmCamera
{
	message Request
	{
		bytes camera_id = 1;
		repeated bytes alarms = 2;
	}
	message Reply
	{
		repeated bytes alarms = 1;
	}
	uint32 ID = 160;
}

message FilterAlarmCamera
{
	enum Type { DETECT_MOTION = 0; DETECT_SOUND = 1; ALL = 2;LINE_CROSSING = 3;INTRUSION_DETECTION = 4;}
	message Request
	{
		uint64 from_date = 1;
		uint64 to_date = 2;
		repeated bytes cameras = 3;
		Type type = 4;
		bytes last_id = 5;
		uint32 count = 6;
	}
	message Reply
	{
		repeated Alarm alarms = 1;
		bool end = 2;
	}
	uint32 ID = 161;
}

/*--------------NHOM CHUC NANG THU VIEN----------------*/

message FilterVideoImageCamera
{
	enum Storage { CLOUD_STORAGE = 0; SD_CARD = 1;}
	enum Type { VIDEO = 0; IMAGE = 1;}
	message Request
	{
		bytes camera_id = 1;
		uint64 from_date = 2;
		uint64 to_date = 3;
		Type type = 4;
		Storage storage = 5;
		string file_id = 6;
		uint32 count = 7;
		bytes last_id = 8; // sử dụng khi filter trên could // chức năng như file_id
		EventType event_type = 9;
	}
	message Reply
	{
		bytes camera_id = 1;
	}
	enum Error
	{
		ERROR_DEFAULT = 0;
		CAMERA_OFFLINE = 1;
	}
	uint32 ID = 163;
}


message GetConfigCamera
{
	message Request
	{
		bytes camera_id = 1;
	}
	message Reply
	{
		CameraConfig config = 1 ;
	}
	uint32 ID = 173;
}


message ResponseShareCamera
{
	enum Action { ACCEPT = 0; DECLINE = 1;}
	message Request
	{
		Action action = 1;
		bytes invite_msg_id = 2; // id của invite msg
	}
	message Reply
	{
		bytes camera_id = 1;
	}

	enum Error
	{
		ERROR_DEFAULT = 0;
		INVALID_SHARE = 1;
	}

	uint32 ID = 176;
}


message ListShareCamera // là danh sách camera / chủ nó và camera đã share
{
	message Request
	{
		bytes camera_id = 1;
	}

	message Reply
	{
		repeated InviteMessage sharing_records = 1;
	}

	uint32 ID = 178;
}

message UpdateShareCamera
{
	enum Role {VIEW = 0; FULL = 1;}
	message Request
	{
		bytes camera_id = 1;
		Role role = 2;
		string account_b = 3;
		bytes invite_msg_id = 4;
	}
	message Reply
	{
		bytes camera_id = 1;
	}
	enum Error
	{
		ERROR_DEFAULT = 0;
		ROLE_NOT_CHANGE = 1;
		ACCOUNT_SHARED_NOT_EXIST = 2;
	}
	uint32 ID = 179;
}

message DeleteShareCamera
{
	message Request
	{
		bytes camera_id = 1;
		string account_b = 2;
		bytes share_id = 3;
	}
	message Reply
	{
		bytes camera_id = 1;
		bytes share_id = 2;
	}
	enum Error
	{
		ERROR_DEFAULT = 0;
		INVALID_SHARE = 1;
	}
	uint32 ID = 180;
}

message ListSharedCamera /// là danh sách lời mời mình  nhận
{
	enum Role {VIEW = 0; FULL = 1;}
	enum GroupShareRole { _NOT_USE = 0;  GVIEW = 1; GMANAGER = 2;}
	enum Status {PENDING = 0; ACCEPT = 1; DELINE = 2;}
	message ShareData
	{
		bytes camera_id = 1;
		string camera_name = 2;
		Role role = 3;
		Status status = 4;
		uint64 time = 5;

	}
	message ShareGroupData
	{
		bytes group_id = 1;
		string group_name = 2;
		GroupShareRole role = 3;
		Status status = 4;
		uint64 time = 5;
	}
	message SharingRecord
	{
		enum ShareType {CAMERA = 0;GROUP = 1;}
		Profile account_a = 1;
		Profile account_b = 2;
		ShareData share_data = 3;
		bytes invite_msg_id = 4;
		ShareType shareType = 5;
		ShareGroupData share_group_data = 6;
	}
	message Request
	{
		bool loadGroupShare = 1;
	}
	message Reply
	{
		repeated SharingRecord sharing_records = 1;
	}
	uint32 ID = 181;
}

message GetTimeShiftVideoCloudCamera
{
	message PlaybackVideo
	{
		uint64 start_time = 1;
		uint64 end_time = 2;
		string url_playback = 4;
		bytes camera_id = 5;
		string url_thumbnail = 6;
		uint32 duration = 7;
		bytes playback_id = 8;
	}

	message Request
	{
		bytes camera_id = 1;
		uint64 current_time = 2; /// server sẽ lấy danh sách video từ thời điểm này - 24h về phía trước // đơn vị gửi lên tính theo giây GMT = 0
		uint32 time_zone = 3; /// default = 0;
		repeated bytes camera_id_list = 4; /// Filter theo nhiều camera
	}
	message Reply
	{
		repeated PlaybackVideo videos = 1; // danh sách video có trong 24h sắp xếp theo current_day trở về quá
		repeated Event events = 2; // danh sách sự kiện có trong 24h xếp theo current_day trở về quá
	}
	enum Error
	{
		DEFAULT = 0;
		CAMERA_ID_EMPTY = 1;
		CAMERA_ID_NOT_FOUND = 2;
	}
	uint32 ID = 182;
}


message SettingCloudStorage
{
	enum StorageMode {CLOUD = 0; CLOUD_AND_SDCARD = 1;}
	message Request
	{
		bytes camera_id = 1;
		bool power = 2;
		StorageMode storage_mode = 3;
		uint32 number_days = 4;
		bool use_default_account_setting = 5; /// on sẽ lấy theo mặc định của account
	}
	message Reply
	{
		bytes camera_id = 1;
	}
	enum Error
	{
		ERROR_DEFAULT = 0;
		CAMERA_ID_INVLID = 1;
		NUMBER_DAY_RECORD_INVALID = 3;
		STORAGE_MODE_INVALID = 4;
	}
	uint32 ID = 183;
}


message UpdateCameraPosition
{
	message CamPosition
	{
		bytes camera_id = 1;
		uint32 position = 2;
	}

	message Request
	{
		repeated CamPosition cam_position = 1;
	}
	message Reply
	{
		repeated Camera cameras = 1;
	}
	uint32 ID = 185;
}

message AddCameraRTSP
{
	message Request
	{
		string name = 1;
		string username = 2;
		string password = 3;
		string rtsp_url = 4;
		MapLocation location = 5; /// location của camera => nếu ko set sẽ lấy giá trị mặc định lat = 0 , log = 0
		bytes box_id = 6; /// gửi lên nếu add 1 camera qua vbox
		bytes group_id = 7; ///Thêm camera vào 1 nhóm (ko truyền hoặc truyền rỗng --> add bình thường
		repeated string sub_stream_urls = 8; // Gửi danh sách luồng phụ của camera
		repeated bytes tagset_id = 9; // danh sách tag
	}
	message Reply
	{
		bytes camera_id = 1;
		Camera camera = 2;
	}
	uint32 ID = 192;

	enum Error
	{
		ERROR_DEFAULT = 0;
		RTSP_EMPTY = 1;
		USER_NOT_FOUND = 2;
		CAMERA_NAME_EMPTY = 3;
		IP_OR_DOMAIN_NOT_AVAILABLE = 4;
		USER_NAME_OR_PASSWORD_ERROR = 5;
		CAMERA_PORT_ERROR = 6;
		CAMERA_EXIST = 7;
		LOCATION_INVALID = 8;
		CAMERA_NAME_EXIST = 9;
		BOX_ID_INVALID = 10;  /// nếu gửi lên thì check xem box đã tồn tại chưa ( hoặc box có thuộc sở hữu của user hay không )
		BOX_OFFLINE = 11; /// ( box đang ko online )
        OVER_QUOTA = 12;//Vượt quá số camera được add (theo license)
        GROUP_INVALID = 13; //Group không tồn tại
        PACKAGE_NOT_SUPPORT = 14; //Không có hoặc gói cước không hỗ trợ thêm camera loại này
        SUB_STREAM_INVALID = 15; //Lỗi luồng phụ (TH gửi nhiều substream url --> chỉ trả về lỗi nếu tất cả url đều lỗi, nếu tồn tại url đúng --> lưu url đúng)
	}
}
message AddCameraOnVif
{
	message Request
	{
		string name = 1;
		string username = 2;
		string password = 3;
		string onvif_device_ip = 4; // http://10.3.3.130:80/onvif/device_service
		string rtsp_url = 5; //rtsp://10.3.3.130:554/Streaming/Channels/102?transportmode=unicast&profile=Profile_2
		string serialNumber = 6; /// tuong duong serial number khi chạy api check camera onvif
		MapLocation location = 7; /// location của camera => nếu ko set sẽ lấy giá trị mặc định lat = 0 , log = 0
		bytes box_id = 8; /// gửi lên nếu add 1 camera qua vbox
		bytes group_id = 9; ///Thêm camera vào 1 nhóm (ko truyền hoặc truyền rỗng --> add bình thường
		string urn = 10; ///urn của cam onvif khi scan (= giá tri urn:uuid khi scan)
		repeated string sub_stream_urls = 11; // Gửi danh sách luồng phụ của camera
		repeated bytes tagset_id = 12; // danh sách tag
	}
	message Reply
	{
		bytes camera_id = 1;
		Camera camera = 2;
	}
	uint32 ID = 199;

	enum Error
	{
		ERROR_DEFAULT = 0;
		RTSP_EMPTY = 1;
		USER_NOT_FOUND = 2;
		CAMERA_NAME_EMPTY = 3;
		IP_OR_DOMAIN_NOT_AVAILABLE = 4;
		USER_NAME_OR_PASSWORD_ERROR = 5;
		SERIAL_NUMBER_EMPTY = 6;
		CAMERA_EXIST = 7;
		RTSP_PORT_ERROR = 8;  // check và trả về khi người dùng gửi link rtsp lên ( nếu gửi lên rtsp_url = rỗng bỏ qua đoạn check )
		LOCATION_INVALID = 9;
		CAMERA_NAME_EXIST = 10;
		SERIAL_NUMBER_NOT_MATH = 11;
		BOX_ID_INVALID = 12;  /// nếu gửi lên thì check xem box đã tồn tại chưa ( hoặc box có thuộc sở hữu của user hay không )
		BOX_OFFLINE = 13; /// ( box đang ko online )
		RTSP_IP_OR_DOMAIN_NOT_AVAILABLE = 14;// check và trả về khi người dùng gửi link rtsp lên ( nếu gửi lên rtsp_url = rỗng bỏ qua đoạn check )
		RTSP_USER_NAME_OR_PASSWORD_ERROR = 15;// check và trả về khi người dùng gửi link rtsp lên ( nếu gửi lên rtsp_url = rỗng bỏ qua đoạn check )
		OVER_QUOTA = 16;//Vượt quá số camera được add (theo license)
		GROUP_INVALID = 17; //Group không tồn tại
		PACKAGE_NOT_SUPPORT = 18; //Không có hoặc gói cước không hỗ trợ thêm camera loại này
		SUB_STREAM_INVALID = 19; //Lỗi luồng phụ (TH gửi nhiều substream url --> chỉ trả về lỗi nếu tất cả url đều lỗi, nếu tồn tại url đúng --> lưu url đúng)
	}
}
