}
message CloudDefaultSetting
{
	message Request
	{
		bool power_cloud_storage = 1; // ON-OFF
		uint32 number_days_storage = 2; // 7 15 30 or custom
	}
	message Reply
	{
		Profile newProfile = 1;
	}
	enum Error
	{
		ERROR_DEFAULT = 0;
	}
	int32 ID = 116;
}

message VerifyURL
{
    message Request
    	{
    		string url = 1; //server base url
    	}
    	message Reply
    	{
    		License_profile license_profile = 1;
    	}
    	enum Error
    	{
    		ERROR_DEFAULT = 0;
    		URL_INVALID = 1;
    	}
    	int32 ID = 117;
}

