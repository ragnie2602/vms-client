message UpdateEmailProfile
{
	message Request
	{
		string otp = 2;
	}
	message Reply
	{
		Profile newProfile = 1;
	}
	enum Error
	{
		ERROR_DEFAULT = 0;
		OTP_EMPTY = 1;
		OTP_NOT_MATCH = 2;
		OPT_EXPIRED = 3;
		OPT_NOT_FOUND = 4;
		EMAIL_EXIST = 5;
		SYN_ERROR = 6;// Lỗi đồng bộ vs ONESME
	}
