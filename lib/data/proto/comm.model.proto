enum Vehicle_Type { CAR = 0; MOTOBIKE = 1; TRUCK = 2; }
message IVAALPRDetection{
	string vehicle_plate_capture = 1;
	string img_capture = 2;
	string vehicle_plate = 3;
	string vehicle_type = 4;
	string video_record_url = 5;
	string img_vehicle = 6;
}

message Vehicle{
    bytes vehicle_id = 1;
	string vehicle_plate = 2;
	Vehicle_Type vehicle_type = 3;
	string owner = 4;
}

message Event
{
	bytes camera_id = 1;
	uint64 time = 2;
	string camera_name = 3;
	EventType type = 4;
	google.protobuf.Any event_metadata = 5;
	bytes event_id = 6;
	string capture_image = 7;
	string video_record_url = 8;
	string capture_image_thumb = 9;
	string description = 10;
	bool has_video_record_url = 11;

}
message DeviceGroup
{
	enum Status { INACTIVE = 0; ACTIVE = 1; }
	enum Type { OWNER = 0; SHARED = 1; MOVED = 2;}
	enum Role {  FULL = 0;GVIEW = 1; GMANAGER = 2;}
	string name = 1;
	bytes parent_group_id = 2;
	Status status = 3;
	uint32 level = 4;
	uint64 created_date = 5;
	uint64 last_update = 6;
	bytes user_created = 7;
	repeated DeviceGroup groups = 8;
	bytes group_id = 10;
	Type group_type = 11;
	Role group_role = 12;

}
enum Base_View { V_1X1 = 0; V_2X2 = 1; V_3X3 = 2;V_4X4 = 3;V_5X5 = 4;V_6X6 = 5;}
message LiveViewPosition
{
	uint32 index = 1;
	bytes camera_id = 2;
	Camera camera = 3;
}
message CustomLiveView
{
	bytes id = 1;
	Base_View base = 2;
	repeated LiveViewPosition postision = 3;
	string name = 4;

}

message InviteMessage
{
	enum Role {VIEW = 0; ALL = 1;}
	enum GroupShareRole { GFULL = 0;  GVIEW = 1; GMANAGER = 2;}
	enum Status {PENDING = 0; ACCEPT = 1; DECLINE = 2;}
	enum ShareType {CAMERA = 0;GROUP_CAMERA = 1;}
	bytes camera_id = 1;
	Role role = 2;
	Status status = 3;
	Profile account_share = 4; /// account share
	Profile account_shared = 5; /// account nhận share
	uint64 last_update = 6;
	bytes  account_share_id = 7; /// account id share
	bytes  account_shared_id = 8; /// account id nhận share
	uint64 time_share = 9;
	//// SHARE GROUP
	ShareType shareType = 10; /// default share camera khi sử dụng cho kc01 và vivas 1.0 trở xuống
	bytes group_id = 11;
	GroupShareRole groupShareRole = 12;
	bytes invite_msg_id = 13;
}

message Vbox
{

	bytes box_id = 1;
	string box_name = 2;
	string box_serial_number = 3;
	Box_Type box_type = 4;
	Box_State box_State = 5;
	bytes owner_user_id = 6;
	uint64 time_added = 7;
