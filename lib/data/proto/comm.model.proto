/// CR010
message NotificationMsg{
	enum MsgType{
		GENERIC = 0;
		SHARE = 1;
	}
	bytes msg_id = 1;
	string title_msg = 2; /// title
	string short_des = 3; /// mô tả ngắn ( chi tiết unpack data của từng loại msg để sử dụng )
	string des = 4; /// mô tả
	bool isRead = 5; /// đã được đọc hay chưa
	uint64 time = 6; /// thời gian xảy ra Notificaiton
	MsgType msgType = 7; //nếu msgType == SHARE thì data = SharingRecord
	google.protobuf.Any data = 8; /// tuỳ theo từng loại NotiType mà data sẽ được pack với từng loại model khác nhau ( với 1 số thông báo không có data gì đặc biệt thì trường data = rỗng )
}
